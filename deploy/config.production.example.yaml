# medical-evaluate 生产配置模板
# 复制为 config.production.yaml，与 .env.production 放在同一目录。
# 数据库、Redis、模型密钥和安全字段由 Compose 环境变量覆盖。

env: production

app:
  name: medical-evaluate
  host: 0.0.0.0
  port: 8000
  debug: false

database:
  host: postgres
  port: 5432
  user: medical
  password: change-by-environment
  db: medical_evaluate
  pool_size: 10
  max_overflow: 20
  pool_pre_ping: true
  echo: false

redis:
  host: redis-app
  port: 6379
  cache_db: 0
  broker_db: 1
  backend_db: 2
  password: change-by-environment
  stream_maxlen: 10000

celery:
  broker_url: null
  backend_url: null
  task_time_limit: 1800
  task_soft_time_limit: 1500

security:
  patient_identity_secret: change-by-environment
  patient_session_ttl_seconds: 28800
  patient_session_cookie: medical_patient_session
  patient_session_secure: true
  staff_session_ttl_seconds: 28800
  staff_session_cookie: medical_staff_session
  staff_session_secure: true

logging:
  level: INFO
  json: true
  file: null

models:
  - name: qwen-plus
    type: language
    display_name: 通义千问 Plus
    model: qwen-plus
    api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key: $DASHSCOPE_API_KEY
    timeout: 600.0
    max_retries: 2
    temperature: 0.7
    max_tokens: 2000
    enable_thinking: false
    enable_prompt_caching: true
    prompt_cache_ttl: "5m"
    supports_thinking: false
    supports_vision: false
    supports_reasoning_effort: false

  - name: qwen-plus-precise
    type: language
    display_name: 通义千问 Plus（确定性）
    model: qwen-plus
    api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key: $DASHSCOPE_API_KEY
    timeout: 600.0
    max_retries: 2
    temperature: 0.1
    max_tokens: 2000
    enable_prompt_caching: true
    prompt_cache_ttl: "5m"
    supports_thinking: false
    supports_vision: false
    supports_reasoning_effort: false

  - name: dialog_agent_voice
    type: voice
    display_name: Qwen Audio Realtime
    provider: qwen_audio_realtime
    model: qwen-audio-3.0-realtime-flash
    websocket_url: wss://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/api-ws/v1/realtime
    api_key: $DASHSCOPE_API_KEY
    timeout: 60.0
    voice: longanqian
    audio_format: pcm_s16le
    input_sample_rate: 16000
    output_sample_rate: 24000
    turn_detection: server_vad
    vad_threshold: 0.1
    silence_duration_ms: 900
    max_history_turns: 50

agent_models:
  schedule_agent:
    language: qwen-plus-precise
  dialog_agent:
    language: qwen-plus
    voice: dialog_agent_voice
  extraction_agent:
    language: qwen-plus
  nursing_plan_agent:
    language: qwen-plus
