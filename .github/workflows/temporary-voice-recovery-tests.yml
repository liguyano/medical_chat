name: temporary-voice-recovery-tests

on:
  push:
    branches:
      - fix/voice-premature-close-recovery

jobs:
  targeted-backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Run targeted tests
        run: python -m pytest tests/unit-test/test_voice_turn_guard.py tests/unit-test/test_voice_gateway.py -q
