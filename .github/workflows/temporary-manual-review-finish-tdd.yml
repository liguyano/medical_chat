name: temporary-manual-review-finish-tdd

on:
  push:
    branches:
      - fix/voice-premature-close-recovery

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - id: tests
        continue-on-error: true
        run: >-
          python -m pytest -q
          tests/unit-test/test_manual_review_policy.py
          tests/unit-test/test_voice_completion_service.py
          tests/unit-test/test_voice_manual_review_completion.py
      - name: Assert expected phase
        env:
          OUTCOME: ${{ steps.tests.outcome }}
        run: |
          if [ -f ../.github/manual-review-red-phase ]; then
            test "$OUTCOME" = "failure"
          else
            test "$OUTCOME" = "success"
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - id: tests
        continue-on-error: true
        run: >-
          pnpm test --
          tests/dialogue/recordedAnswersPanel.test.ts
          tests/api/manualReviewMapper.test.ts
          tests/transports/manualReviewEvent.test.ts
      - name: Assert expected phase
        env:
          OUTCOME: ${{ steps.tests.outcome }}
        run: |
          if [ -f ../.github/manual-review-red-phase ]; then
            test "$OUTCOME" = "failure"
          else
            test "$OUTCOME" = "success"
          fi
