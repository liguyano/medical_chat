name: temporary-apply-manual-review-fix

on:
  push:
    branches:
      - fix/voice-premature-close-recovery
    paths:
      - .github/workflows/temporary-apply-manual-review-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused production fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"replacement target missing: {path} expected>={count} actual={actual}\n{old[:160]}")
              p.write_text(text.replace(old, new, count), encoding="utf-8")

          # 1) 完成屏障：只有系统专门创建的人工审核结束播报才有资格完成。
          path = "backend/app/services/voice_completion_service.py"
          replace(
              path,
              '''        response_id: str | None = None,\n        generation_id: str | None = None,\n    ) -> bool:\n        """登记一轮可见 AI 回复完成，并在评估已完成时尝试收尾。"""''',
              '''        response_id: str | None = None,\n        generation_id: str | None = None,\n        is_manual_review_completion: bool = False,\n    ) -> bool:\n        """登记一轮可见 AI 回复完成，并在评估已完成时尝试收尾。"""''',
          )
          replace(
              path,
              '''                    "response_id": response_id,\n                    "generation_id": generation_id,\n                },''',
              '''                    "response_id": response_id,\n                    "generation_id": generation_id,\n                    "is_manual_review_completion": bool(\n                        is_manual_review_completion\n                    ),\n                },''',
          )
          replace(
              path,
              '''                if not bool(pending.get("manual_review_notified")):\n                    return False\n                if not _is_manual_review_completion_response(''',
              '''                if not bool(pending.get("manual_review_notified")):\n                    return False\n                if not bool(response.get("is_manual_review_completion")):\n                    return False\n                if not _is_manual_review_completion_response(''',
          )
          replace(
              path,
              '''    response_id: str | None = None,\n    generation_id: str | None = None,\n    redis: RedisClient | Any | None = None,\n) -> bool:\n    """登记 Qwen Realtime 可见回复完成。"""''',
              '''    response_id: str | None = None,\n    generation_id: str | None = None,\n    is_manual_review_completion: bool = False,\n    redis: RedisClient | Any | None = None,\n) -> bool:\n    """登记 Qwen Realtime 可见回复完成。"""''',
          )
          replace(
              path,
              '''        response_id=response_id,\n        generation_id=generation_id,\n    )''',
              '''        response_id=response_id,\n        generation_id=generation_id,\n        is_manual_review_completion=is_manual_review_completion,\n    )''',
          )

          # 2) Voice Gateway：给专门结束播报打运行态标记，并补齐 Extraction 后主动播报。
          path = "backend/app/services/voice_gateway.py"
          replace(
              path,
              '''from app.services.dialog_tool_executor import execute_tool\nfrom app.services.qwen_realtime_client import QwenRealtimeClient''',
              '''from app.services.dialog_tool_executor import execute_tool\nfrom app.services.manual_review_service import (\n    ensure_planned_manual_review_notification,\n)\nfrom app.services.qwen_realtime_client import QwenRealtimeClient''',
          )
          replace(
              path,
              '''    completed: bool = False\n    is_recovery: bool = False\n''',
              '''    completed: bool = False\n    is_recovery: bool = False\n    is_manual_review_completion: bool = False\n''',
          )
          replace(
              path,
              '''    recovery_task: Any | None = None\n    recovery_mode_active: bool = False''',
              '''    recovery_task: Any | None = None\n    manual_review_completion_task: Any | None = None\n    recovery_mode_active: bool = False''',
          )
          replace(
              path,
              '''    next_response_is_recovery: bool = False\n    recovery_instruction_active: bool = False''',
              '''    next_response_is_recovery: bool = False\n    next_response_is_manual_review_completion: bool = False\n    recovery_instruction_active: bool = False''',
          )
          replace(
              path,
              '''            gateway_session.receive_task = asyncio.create_task(\n                self._consume_upstream(gateway_session)\n            )\n            return gateway_session''',
              '''            gateway_session.receive_task = asyncio.create_task(\n                self._consume_upstream(gateway_session)\n            )\n            if (\n                initial_decision.progress.completed\n                and int(patient_info.get("manual_review_count") or 0) > 0\n            ):\n                gateway_session.manual_review_completion_task = asyncio.create_task(\n                    self._start_manual_review_completion_response(gateway_session)\n                )\n            return gateway_session''',
          )
          replace(
              path,
              '''        if session.recovery_task is not None:\n            session.recovery_task.cancel()\n            session.recovery_task = None\n        await session.client.close()''',
              '''        if session.recovery_task is not None:\n            session.recovery_task.cancel()\n            session.recovery_task = None\n        if session.manual_review_completion_task is not None:\n            session.manual_review_completion_task.cancel()\n            session.manual_review_completion_task = None\n        await session.client.close()''',
          )
          replace(
              path,
              '''            is_recovery=(\n                session.recovery_mode_active\n                or session.next_response_is_recovery\n            ),\n        )\n        session.next_response_is_recovery = False''',
              '''            is_recovery=(\n                session.recovery_mode_active\n                or session.next_response_is_recovery\n            ),\n            is_manual_review_completion=(\n                session.next_response_is_manual_review_completion\n            ),\n        )\n        session.next_response_is_recovery = False\n        session.next_response_is_manual_review_completion = False''',
          )
          replace(
              path,
              '''        closing_candidate = (\n            not generation.is_recovery\n            and VoiceTurnGuard.has_closing_intent(generation.text)\n        )''',
              '''        closing_candidate = (\n            not generation.is_recovery\n            and not generation.is_manual_review_completion\n            and VoiceTurnGuard.has_closing_intent(generation.text)\n        )''',
          )
          replace(
              path,
              '''                generation_id=generation.generation_id,\n                redis=session.redis,\n            )\n        if generation.is_recovery:''',
              '''                generation_id=generation.generation_id,\n                is_manual_review_completion=(\n                    generation.is_manual_review_completion\n                ),\n                redis=session.redis,\n            )\n            if (\n                not generation.is_recovery\n                and not generation.is_manual_review_completion\n                and int(session.patient_info.get("manual_review_count") or 0) > 0\n            ):\n                self._schedule_manual_review_completion_after_extraction(session)\n        if generation.is_recovery:''',
          )
          replace(
              path,
              '''        await self._maybe_create_response(session)\n\n    @staticmethod\n    def _remove_generation(''',
              '''        if (\n            generation is not None\n            and generation.is_manual_review_completion\n            and not session.closed\n        ):\n            self._schedule_manual_review_completion_after_extraction(session)\n        await self._maybe_create_response(session)\n\n    @staticmethod\n    def _remove_generation(''',
          )
          insert_before = '''    def _schedule_premature_close_recovery(\n        self,\n        session: VoiceSession,\n        *,\n        response_id: str | None,\n    ) -> None:\n'''
          manual_methods = '''    def _schedule_manual_review_completion_after_extraction(\n        self,\n        session: VoiceSession,\n    ) -> None:\n        """每轮普通回复后等待 Extraction，完成时补一条专门人工审核结束播报。"""\n        existing = session.manual_review_completion_task\n        if existing is not None and not existing.done():\n            existing.cancel()\n        session.manual_review_completion_task = asyncio.create_task(\n            self._announce_manual_review_after_extraction(session)\n        )\n\n    async def _announce_manual_review_after_extraction(\n        self,\n        session: VoiceSession,\n    ) -> None:\n        """等待当前患者答案入库；仅在 AI 可采集题全部完成后触发结束播报。"""\n        current_task = asyncio.current_task()\n        try:\n            source_message_no = await asyncio.to_thread(\n                VoiceTurnGuard.latest_patient_message_no,\n                session.session_no,\n            )\n            if not source_message_no:\n                return\n            waited = 0.0\n            while not VoiceTurnGuard.extraction_processed(\n                session.redis,\n                session.session_no,\n                source_message_no,\n            ):\n                if session.closed:\n                    return\n                if waited >= VOICE_CLOSE_RECOVERY_TIMEOUT_SECONDS:\n                    logger.warning(\n                        "人工审核结束播报等待 Extraction 超时: session=%s source=%s",\n                        session.session_no,\n                        source_message_no,\n                    )\n                    return\n                await asyncio.sleep(VOICE_CLOSE_RECOVERY_POLL_SECONDS)\n                waited += VOICE_CLOSE_RECOVERY_POLL_SECONDS\n\n            decision = await asyncio.to_thread(\n                VoiceTurnGuard.build_recovery_decision,\n                session.session_no,\n                session.task_list,\n            )\n            if not decision.progress.completed:\n                return\n            await self._start_manual_review_completion_response(session)\n        except asyncio.CancelledError:\n            return\n        except Exception:\n            logger.exception(\n                "人工审核结束播报触发失败，保留语音会话等待重试: session=%s",\n                session.session_no,\n            )\n        finally:\n            if session.manual_review_completion_task is current_task:\n                session.manual_review_completion_task = None\n\n    async def _start_manual_review_completion_response(\n        self,\n        session: VoiceSession,\n    ) -> None:\n        """通知责任护士后，创建唯一有资格跨越最终完成屏障的 Qwen 响应。"""\n        configured_count = int(session.patient_info.get("manual_review_count") or 0)\n        if configured_count <= 0 or session.closed:\n            return\n        notification = await asyncio.to_thread(\n            ensure_planned_manual_review_notification,\n            session.session_no,\n        )\n        if notification.item_count <= 0 or not notification.notified:\n            logger.error(\n                "固定人工审核通知未就绪，拒绝创建结束播报: session=%s",\n                session.session_no,\n            )\n            return\n\n        waited = 0.0\n        while (\n            session.speech_active\n            or session.responding\n            or session.active_response_ids\n            or session.response_requested\n            or session.pending_tool_responses > 0\n        ):\n            if session.closed:\n                return\n            if waited >= VOICE_CLOSE_RECOVERY_TIMEOUT_SECONDS:\n                logger.warning(\n                    "人工审核结束播报等待当前语音响应结束超时: session=%s",\n                    session.session_no,\n                )\n                return\n            await asyncio.sleep(VOICE_CLOSE_RECOVERY_POLL_SECONDS)\n            waited += VOICE_CLOSE_RECOVERY_POLL_SECONDS\n\n        await session.client.update_instructions(\n            self._build_manual_review_completion_instructions(\n                notification.item_count\n            )\n        )\n        session.next_response_is_manual_review_completion = True\n        session.response_requested = True\n        try:\n            await session.client.create_response()\n        except Exception:\n            session.response_requested = False\n            session.next_response_is_manual_review_completion = False\n            raise\n        logger.info(\n            "已创建固定人工审核专门结束播报: session=%s count=%s request=%s",\n            session.session_no,\n            notification.item_count,\n            notification.request_id,\n        )\n\n    @staticmethod\n    def _build_manual_review_completion_instructions(item_count: int) -> str:\n        """专门结束播报只允许告知人工审核安排，不得生成新问题。"""\n        return (\n            "你是一名专业的AI护理助手。结构化AI问答已经完成。\\n"\n            "现在只允许向患者播报下面这一句话，不得增加任何问题、宣教、解释或其他内容：\\n"\n            f"本次AI问答已经完成，剩余{item_count}项固定内容需要护士人工审核；"\n            "我已通知责任护士，请您稍候。\\n"\n            "播报完立即停止输出，等待系统结束会话。"\n        )\n\n'''
          replace(path, insert_before, manual_methods + insert_before)
          replace(
              path,
              '''    async def _finish_recovery_mode(self, session: VoiceSession) -> None:\n        """全部 remaining 清空后停止提问，等待既有完成屏障结束会话。"""\n        terminal_instructions = self._build_completed_wait_instructions()\n        try:\n            await session.client.update_instructions(terminal_instructions)\n        finally:\n            session.recovery_instruction_active = False\n            session.recovery_mode_active = False\n            session.recovery_current_question_id = None\n            session.recovery_source_message_no = None\n            session.recovery_answer_response_pending = False\n            session.next_response_is_recovery = False\n''',
              '''    async def _finish_recovery_mode(self, session: VoiceSession) -> None:\n        """全部 remaining 清空后停止提问；有固定审核时追加专门结束播报。"""\n        try:\n            if int(session.patient_info.get("manual_review_count") or 0) > 0:\n                await self._start_manual_review_completion_response(session)\n            else:\n                await session.client.update_instructions(\n                    self._build_completed_wait_instructions()\n                )\n        finally:\n            session.recovery_instruction_active = False\n            session.recovery_mode_active = False\n            session.recovery_current_question_id = None\n            session.recovery_source_message_no = None\n            session.recovery_answer_response_pending = False\n            session.next_response_is_recovery = False\n''',
          )

          # 3) 前端 REST DTO / mapper 保留人工审核采集状态。
          path = "frontend/src/lib/api/contracts.ts"
          replace(
              path,
              '''  invalid_reason?: string;\n  raw_answer?: Record<string, unknown>;\n}''',
              '''  invalid_reason?: string;\n  raw_answer?: Record<string, unknown>;\n  collection_status?:\n    | 'ai_recorded'\n    | 'pending'\n    | 'manual_review_pending'\n    | 'manual_review_completed';\n}''',
          )
          path = "frontend/src/lib/api/mappers.ts"
          replace(
              path,
              '''    invalidReason: field.invalid_reason,\n    rawAnswer: field.raw_answer,\n  };''',
              '''    invalidReason: field.invalid_reason,\n    rawAnswer: field.raw_answer,\n    collectionStatus: field.collection_status,\n  };''',
          )

          # 4) 前端实时事件：透传 collection_status；系统固定审核只进事件流，不冒充患者呼叫。
          path = "frontend/src/lib/transports/applyRealtimeEvent.ts"
          replace(
              path,
              '''          rawAnswer:\n            raw.raw_answer && typeof raw.raw_answer === 'object'\n              ? (raw.raw_answer as Record<string, unknown>)\n              : undefined,\n        };''',
              '''          rawAnswer:\n            raw.raw_answer && typeof raw.raw_answer === 'object'\n              ? (raw.raw_answer as Record<string, unknown>)\n              : undefined,\n          collectionStatus:\n            raw.collection_status === undefined || raw.collection_status === null\n              ? undefined\n              : (String(\n                  raw.collection_status\n                ) as StructuredAnswer['collectionStatus']),\n        };''',
          )
          replace(
              path,
              '''      ) as 'patient' | 'agent';\n      const resolved =''',
              '''      ) as 'patient' | 'agent' | 'system';\n      const requestedAction = value(\n        event.payload,\n        'requested_action',\n        'other'\n      );\n      const isPlannedManualReview =\n        requestSource === 'system' && requestedAction === 'planned_manual_review';\n      const resolved =''',
          )
          replace(
              path,
              '''        requestedAction: value(\n          event.payload,\n          'requested_action',\n          'other'\n        ),''',
              '''        requestedAction,''',
          )
          replace(
              path,
              '''        requestSource,\n        toolName: value(event.payload, 'tool_name', undefined),''',
              '''        requestSource,\n        reviewItems: value(event.payload, 'review_items', []),\n        toolName: value(event.payload, 'tool_name', undefined),''',
          )
          replace(
              path,
              '''      if (!resolved) {\n        taskStore.requestHandoff''',
              '''      if (!resolved && !isPlannedManualReview) {\n        taskStore.requestHandoff''',
          )
          old_assistance = '''      chatStore.upsertNurseAssistanceRequest({\n        requestId,\n        taskId: event.task_id,\n        patientName: value(event.payload, 'patient_name', undefined),\n        bedNo: value(event.payload, 'bed_no', undefined),\n        wardName: value(event.payload, 'ward_name', undefined),\n        reason,\n        requestedAction: value(\n          event.payload,\n          'requested_action',\n          'other'\n        ),\n        actionLabel: value(\n          event.payload,\n          'action_label',\n          '人工护理操作'\n        ),\n        urgency: value(\n          event.payload,\n          'urgency',\n          'routine'\n        ) as 'routine' | 'urgent',\n        status: resolved ? 'resolved' : 'requested',\n        occurredAt: event.occurred_at,\n        requestSource,\n        toolName: value(event.payload, 'tool_name', undefined),\n        toolArgs: value(event.payload, 'tool_args', undefined),\n        toolResult: value(event.payload, 'tool_result', undefined),\n        handledAt: value(event.payload, 'handled_at', undefined),\n        resolvedByStaffId: value(\n          event.payload,\n          'resolved_by_staff_id',\n          undefined\n        ),\n        resolvedByStaffNo: value(\n          event.payload,\n          'resolved_by_staff_no',\n          undefined\n        ),\n        resolvedByName: value(\n          event.payload,\n          'resolved_by_name',\n          undefined\n        ),\n        resolution: value(event.payload, 'resolution', undefined),\n      });'''
          new_assistance = '''      if (!isPlannedManualReview) {\n        chatStore.upsertNurseAssistanceRequest({\n          requestId,\n          taskId: event.task_id,\n          patientName: value(event.payload, 'patient_name', undefined),\n          bedNo: value(event.payload, 'bed_no', undefined),\n          wardName: value(event.payload, 'ward_name', undefined),\n          reason,\n          requestedAction,\n          actionLabel: value(\n            event.payload,\n            'action_label',\n            '人工护理操作'\n          ),\n          urgency: value(\n            event.payload,\n            'urgency',\n            'routine'\n          ) as 'routine' | 'urgent',\n          status: resolved ? 'resolved' : 'requested',\n          occurredAt: event.occurred_at,\n          requestSource,\n          toolName: value(event.payload, 'tool_name', undefined),\n          toolArgs: value(event.payload, 'tool_args', undefined),\n          toolResult: value(event.payload, 'tool_result', undefined),\n          handledAt: value(event.payload, 'handled_at', undefined),\n          resolvedByStaffId: value(\n            event.payload,\n            'resolved_by_staff_id',\n            undefined\n          ),\n          resolvedByStaffNo: value(\n            event.payload,\n            'resolved_by_staff_no',\n            undefined\n          ),\n          resolvedByName: value(\n            event.payload,\n            'resolved_by_name',\n            undefined\n          ),\n          resolution: value(event.payload, 'resolution', undefined),\n        });\n      }'''
          replace(path, old_assistance, new_assistance)
          PY

          git diff --check
          git diff --stat
      - name: Commit production fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/voice_completion_service.py \
                  backend/app/services/voice_gateway.py \
                  frontend/src/lib/api/contracts.ts \
                  frontend/src/lib/api/mappers.ts \
                  frontend/src/lib/transports/applyRealtimeEvent.ts
          git commit -m "fix(manual-review): 完成人工审核语音收尾与前端分流"
          git push origin HEAD:fix/voice-premature-close-recovery
