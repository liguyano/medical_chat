name: temporary-voice-dialog-exclusion-tests

on:
  push:
    branches:
      - fix/voice-premature-close-recovery

jobs:
  targeted:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Compile changed backend modules
        run: >
          python -m compileall -q
          app/api/voice_dialog.py
          app/services/agent_dispatch_service.py
      - name: Run targeted tests
        run: >
          python -m pytest -q
          tests/unit-test/test_dialog_celery.py
          tests/unit-test/test_agent_dispatch_service.py
          tests/unit-test/test_voice_gateway.py
          tests/unit-test/test_voice_turn_guard.py
