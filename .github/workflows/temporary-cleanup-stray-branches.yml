name: temporary-cleanup-stray-branches

on:
  push:
    branches:
      - fix/voice-premature-close-recovery
    paths:
      - .github/workflows/temporary-cleanup-stray-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete temporary debug branches
        run: git push origin --delete tmp-never tmp-never-2 tmp-never-3
